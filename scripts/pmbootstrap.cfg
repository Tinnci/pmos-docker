# pmbootstrap 配置文件（供容器内 pmbootstrap 使用）
# 路径：/work/pmbootstrap/.config/pmbootstrap.cfg  (HOME=/work/pmbootstrap)
#
# CI 初始化流程：
#   1. init-pmbootstrap.sh 通过 "printf | pmbootstrap init" 设置 work=/work/pmbootstrap
#   2. 随后用 "pmbootstrap config device/ui/kernel" 覆写目标设备配置
#   3. 本文件反映最终生效的配置，用于文档参考和本地手动恢复
#
# 若需手动重置（容器内）：
#   su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap config <key> <value>"

[pmbootstrap]
aports = /work/pmbootstrap/cache_git/pmaports
ccache_size = 5G
channel = edge
device = google-kukui
extra_packages =
hostname = postmarketos
is_default_channel = False
jobs = 4
kernel = postmarketos-mediatek-mt81
keymap =
locale = en_US.UTF-8
nonfree_firmware = True
nonfree_userland = False
ssh_keys = False
ssh_key_glob = ~/.ssh/id_*.pub
timezone = UTC
ui = plasma-mobile
ui_extras = False
user = user
work = /work/pmbootstrap

[providers]

[mirrors]
alpine = http://dl-cdn.alpinelinux.org/alpine/
alpine_custom = none
pmaports = http://mirror.postmarketos.org/postmarketos/
pmaports_custom = none
systemd = http://mirror.postmarketos.org/postmarketos/extra-repos/systemd/
systemd_custom = none
