# pmbootstrap 配置文件模板
# 由 init-pmbootstrap.sh 自动部署到 $HOME/.config/pmbootstrap.cfg
# HOME=/work/pmbootstrap → 配置路径：/work/pmbootstrap/.config/pmbootstrap.cfg
#
# 修改后需要重新运行 init-pmbootstrap.sh 使配置生效
[pmbootstrap]
aports = /work/pmbootstrap/.local/var/pmbootstrap/cache_git/pmaports
ccache_size = 5G
channel = edge
device = google-kukui
extra_packages =
hostname = postmarketos
is_default_channel = False
jobs = 4
kernel = postmarketos-mediatek-mt81
keymap =
locale = en_US.UTF-8
nonfree_firmware = True
nonfree_userland = False
ssh_keys = False
ssh_key_glob = ~/.ssh/id_*.pub
timezone = UTC
ui = plasma-mobile
ui_extras = False
user = user
work = /work/pmbootstrap/.local/var/pmbootstrap

[providers]

[mirrors]
alpine = http://dl-cdn.alpinelinux.org/alpine/
alpine_custom = none
pmaports = http://mirror.postmarketos.org/postmarketos/
pmaports_custom = none
systemd = http://mirror.postmarketos.org/postmarketos/extra-repos/systemd/
systemd_custom = none
