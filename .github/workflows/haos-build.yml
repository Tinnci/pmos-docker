name: Build HAOS image (OTBR)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "home-assistant/operating-system branch or tag"
        required: true
        default: "17.3"
      target:
        description: "HAOS build target"
        required: true
        default: "google_kukui"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HAOS_REF: ${{ inputs.upstream_ref }}
  HAOS_TARGET: ${{ inputs.target }}
  HAOS_DIR: ${{ github.workspace }}/work/haos
  CACHE_DIR: /tmp/haos-cache
  EXPORT_DIR: ${{ github.workspace }}/work/haos-artifacts
  HAOS_CCACHE_DIR: /tmp/haos-ccache
  HAOS_BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/haos-builder:kukui-17.3

jobs:
  validate-scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh tests/*.sh; do
            sh -n "$file"
          done

      - name: Run script tests
        run: |
          sh tests/actions_node24_test.sh
          sh tests/haos_buildctl_test.sh
          sh tests/haos_kukui_scripts_test.sh
          sh tests/haos_workflow_test.sh

  config-google-kukui:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: validate-scripts

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h

      - name: Restore Buildroot downloads
        uses: actions/cache@v5
        with:
          path: /tmp/haos-cache/dl
          key: haos-dl-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-${{ hashFiles('scripts/*.sh') }}
          restore-keys: |
            haos-dl-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-
            haos-dl-${{ inputs.upstream_ref }}-${{ runner.os }}-
            haos-dl-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /tmp/haos-ccache
          key: haos-ccache-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            haos-ccache-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-
            haos-ccache-${{ inputs.upstream_ref }}-${{ runner.os }}-
            haos-ccache-

      - name: Normalize GHCR image name
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "HAOS_BUILDER_IMAGE=ghcr.io/${owner}/haos-builder:kukui-17.3" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare source layer
        run: scripts/haos-buildctl.sh layer-source

      - name: Check builder layer
        run: scripts/haos-buildctl.sh layer-builder

      - name: Run Buildroot config
        run: scripts/haos-buildctl.sh config

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p work/diagnostics
          scripts/haos-buildctl.sh diagnostics > work/diagnostics/config-diagnostics.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: haos-config-diagnostics-${{ github.sha }}
          path: work/diagnostics
          if-no-files-found: ignore
          retention-days: 14

  build-google-kukui:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    needs: validate-scripts

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h

      - name: Restore Buildroot downloads
        uses: actions/cache@v5
        with:
          path: /tmp/haos-cache/dl
          key: haos-dl-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-${{ hashFiles('scripts/*.sh') }}
          restore-keys: |
            haos-dl-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-
            haos-dl-${{ inputs.upstream_ref }}-${{ runner.os }}-
            haos-dl-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /tmp/haos-ccache
          key: haos-ccache-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            haos-ccache-${{ inputs.upstream_ref }}-${{ inputs.target }}-${{ runner.os }}-
            haos-ccache-${{ inputs.upstream_ref }}-${{ runner.os }}-
            haos-ccache-

      - name: Normalize GHCR image name
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "HAOS_BUILDER_IMAGE=ghcr.io/${owner}/haos-builder:kukui-17.3" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare source layer
        run: scripts/haos-buildctl.sh layer-source

      - name: Check builder layer
        run: scripts/haos-buildctl.sh layer-builder

      - name: Warm download layer
        run: scripts/haos-buildctl.sh layer-download

      - name: Build compile layer
        run: scripts/haos-buildctl.sh layer-compile

      - name: Export artifact layer
        run: scripts/haos-buildctl.sh layer-artifact

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p work/diagnostics
          scripts/haos-buildctl.sh diagnostics > work/diagnostics/build-diagnostics.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: haos-build-diagnostics-${{ github.sha }}
          path: work/diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload HAOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: haos-${{ inputs.target }}-${{ github.sha }}
          path: work/haos-artifacts
          if-no-files-found: error
          retention-days: 14

  verify-artifacts:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: build-google-kukui

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Download HAOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: haos-${{ inputs.target }}-${{ github.sha }}
          path: work/haos-artifacts

      - name: Normalize GHCR image name
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "HAOS_BUILDER_IMAGE=ghcr.io/${owner}/haos-builder:kukui-17.3" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify HAOS artifacts
        run: scripts/haos-buildctl.sh verify-artifacts

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p work/diagnostics
          scripts/haos-buildctl.sh diagnostics > work/diagnostics/verify-diagnostics.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: haos-verify-diagnostics-${{ github.sha }}
          path: work/diagnostics
          if-no-files-found: ignore
          retention-days: 14
