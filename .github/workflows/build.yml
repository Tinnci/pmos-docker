name: Build pmos kernel (google-kukui)

on:
  push:
    branches: [master]
    paths:
      - 'scripts/bootstrap-pmbootstrap.sh'
      - 'scripts/init-pmbootstrap.sh'
      - 'scripts/patch-kernel-otbr.sh'
      - 'scripts/tar-wrapper.sh'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/bootstrap-pmbootstrap.sh'
      - 'scripts/init-pmbootstrap.sh'
      - 'scripts/patch-kernel-otbr.sh'
      - 'scripts/tar-wrapper.sh'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建（忽略缓存）'
        type: boolean
        default: false
  # 允许 release.yml 通过 workflow_call 复用本工作流
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: '上传的 kernel APK artifact 名称'
        value: ${{ jobs.build.outputs.artifact-name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KERNEL_PKG: linux-postmarketos-mediatek-mt81
  DEVICE: google-kukui

jobs:
  # ── 前置验证（<30s）：快速发现明显错误，避免等待 2 小时后才报失败 ──
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell scripts syntax
        run: |
          echo "检查 sh 脚本语法..."
          for f in scripts/*.sh; do
            sh -n "$f" && echo "  ✓ $f" || { echo "  ✗ $f 语法错误"; exit 1; }
          done

      - name: Validate kconfig keys in patch script
        run: |
          echo "检查 patch-kernel-otbr.sh 中 CONFIG_* 键格式..."
          INVALID=0
          # 提取所有 kset_y/kset_m/kset_n 调用的 CONFIG_* 键
          grep -E '^\s*kset_[ymn]\s+CONFIG_' scripts/patch-kernel-otbr.sh \
            | sed 's/.*kset_[ymn]\s\+//' | awk '{print $1}' \
            | while IFS= read -r key; do
              if ! echo "$key" | grep -qE '^CONFIG_[A-Z0-9_]+$'; then
                echo "  ✗ 非法 kconfig key: $key"
                INVALID=1
              fi
            done
          # 检查不应出现的 kset_n（可能误禁了必要项）
          DISABLED=$(grep -cE '^\s*kset_n\s+CONFIG_' scripts/patch-kernel-otbr.sh || true)
          echo "  配置摘要："
          echo "    kset_y: $(grep -cE '^\s*kset_y\s+CONFIG_' scripts/patch-kernel-otbr.sh || true) 项"
          echo "    kset_m: $(grep -cE '^\s*kset_m\s+CONFIG_' scripts/patch-kernel-otbr.sh || true) 项"
          echo "    kset_n: ${DISABLED} 项（禁用项，如有请确认必要性）"
          echo "  ✓ kconfig 键格式检查通过"

      - name: Validate docker-compose.yml
        run: |
          # 检查 docker compose config 是否合法（不需要拉取镜像）
          docker compose config --quiet && echo "✓ docker-compose.yml 语法合法"

  build:
    needs: validate
    runs-on: ubuntu-latest
    # aarch64 交叉编译约 40-60 分钟
    timeout-minutes: 360
    outputs:
      artifact-name: ${{ steps.artifact-meta.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 月份标识用于缓存 key 自动轮转（Docker 镜像 / pmaports）
      - name: Set monthly cache key
        run: echo "YM=$(date +%Y%m)" >> $GITHUB_ENV

      # ── 缓存 1: ccache
      # 策略：restore-only key 用分支名匹配最近一次构建结果；
      # save 时用 run_id 写入新 entry（防止并发覆盖），旧 entry 由 GitHub 自动 LRU 淘汰。
      # primary key 故意用 run_id 使其「只写不读」，真正恢复由 restore-keys 完成。
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ccache/
          key: ccache-${{ env.KERNEL_PKG }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KERNEL_PKG }}-${{ github.ref_name }}-
            ccache-${{ env.KERNEL_PKG }}-

      # ── 缓存 2: pip（pmbootstrap Python 依赖，极少变化）─────
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          path: cache/
          key: pip-pmos-${{ env.KERNEL_PKG }}

      # ── 缓存 3: apk 包缓存（避免每次重新下载 pmbootstrap+工具链，节省约 5 分钟）
      - name: Restore apk cache
        uses: actions/cache@v5
        with:
          path: cache/apk/
          key: apk-pmos-${{ env.YM }}
          restore-keys: apk-pmos-

      # ── 缓存 4: 内核源码 tarball（~147MB，省去每次重新下载）
      - name: Restore distfiles cache
        uses: actions/cache@v5
        with:
          path: work/pmbootstrap/cache_distfiles/
          key: distfiles-${{ env.KERNEL_PKG }}
          restore-keys: distfiles-

      # ── 缓存 5: pmaports git 仓库（省去每次重新 clone ~3min）
      # 月度轮转 key 保证定期拉取最新；pmbootstrap pull 会增量更新
      - name: Restore pmaports cache
        uses: actions/cache@v5
        with:
          path: work/pmbootstrap/cache_git/
          key: pmaports-${{ env.KERNEL_PKG }}-${{ env.YM }}
          restore-keys: |
            pmaports-${{ env.KERNEL_PKG }}-
            pmaports-

      # ── 缓存 6: Docker 镜像（172MB，省去每次重新拉取）────────
      # 月度轮转 key 保证定期拉取最新 edge 版本
      - name: Cache Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/pmos-image.tar.gz
          key: docker-pmos-${{ env.YM }}-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            docker-pmos-${{ env.YM }}-
            docker-pmos-

      - name: Load or pull Docker image
        run: |
          IMAGE=$(grep 'image:' docker-compose.yml | awk '{print $2}' | head -1)
          if [ -f /tmp/pmos-image.tar.gz ]; then
            echo "从缓存加载 Docker 镜像..."
            docker load < /tmp/pmos-image.tar.gz
          else
            echo "拉取 Docker 镜像: $IMAGE"
            docker pull "$IMAGE"
            echo "保存镜像至缓存..."
            docker save "$IMAGE" | gzip > /tmp/pmos-image.tar.gz
          fi

      # ── 注册 aarch64 binfmt_misc ────────────────────────────
      - name: Register binfmt_misc for aarch64
        run: |
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      # ── 启动 pmos-builder 容器 ──────────────────────────────
      - name: Start pmos-builder container
        run: |
          mkdir -p cache/apk
          docker compose up -d

      # ── 显式执行 bootstrap（确定性，避免容器启动阶段隐藏超时） ─────────
      - name: Bootstrap pmbootstrap in container
        run: |
          docker compose exec -T pmos-builder sh /scripts/bootstrap-pmbootstrap.sh
          docker compose exec -T pmos-builder sh -c 'command -v pmbootstrap >/dev/null 2>&1'

      # ── 初始化 pmbootstrap（若未初始化或 cfg 格式过旧） ──────
      - name: Init pmbootstrap
        run: |
          # 通过 pmbootstrap config device 判断是否已正确初始化
          # （3.9.0 读取旧格式 cfg 会报错，比文件存在检查更可靠）
          if ! docker compose exec -T pmos-builder sh -c \
              'su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap config device 2>/dev/null"' \
              2>/dev/null | grep -q 'google-kukui'; then
            echo "运行 init-pmbootstrap.sh..."
            docker compose exec -T pmos-builder sh /scripts/init-pmbootstrap.sh
          else
            echo "pmbootstrap 已初始化，检查 pmaports..."
            docker compose exec -T pmos-builder sh -c '
              su -s /bin/sh pmbuild -c "
                export HOME=/work/pmbootstrap
                APORTS=\$(pmbootstrap config aports 2>/dev/null || echo /work/pmbootstrap/cache_git/pmaports)
                if [ ! -d \"\$APORTS/.git\" ]; then
                  echo pmaports 不存在，重新拉取...
                  pmbootstrap pull
                else
                  echo pmaports 已存在: \$APORTS
                fi
              "
            '
          fi

      # ── 打内核配置补丁 ──────────────────────────────────────
      - name: Patch kernel config (OTBR/BLE/FQ)
        run: |
          docker compose exec -T pmos-builder sh /scripts/patch-kernel-otbr.sh

      # ── 更新 APKBUILD checksum ──────────────────────────────
      - name: Update kernel checksum
        run: |
          docker compose exec -T pmos-builder sh -c \
            'su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap checksum ${{ env.KERNEL_PKG }}"'

      # ── kconfig 合规检查 ────────────────────────────────────
      - name: kconfig compliance check
        run: |
          docker compose exec -T pmos-builder sh -c \
            'su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap kconfig check ${{ env.KERNEL_PKG }}"'

      # ── 初始化 native chroot + 安装 tar wrapper ─────────────
      # build_init 创建 chroot_native（含 gcc-aarch64 工具链）但不编译内核
      # tar wrapper 在此之后安装，修复 Docker overlay2 解压内核 tarball 的伪错误
      - name: Init native chroot and apply tar wrapper
        run: |
          docker compose exec -T pmos-builder sh -c \
            'su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap build_init"'
          docker compose exec -T pmos-builder sh -c '
            CHROOT_TAR="/work/pmbootstrap/chroot_native/usr/bin/tar"
            if [ -f "$CHROOT_TAR" ] && [ ! -f "${CHROOT_TAR}.real" ]; then
              cp "$CHROOT_TAR" "${CHROOT_TAR}.real"
              cp /scripts/tar-wrapper.sh "$CHROOT_TAR"
              chmod +x "$CHROOT_TAR"
              echo "✓ tar wrapper 已安装"
            elif [ -f "${CHROOT_TAR}.real" ]; then
              echo "✓ tar wrapper 已存在"
            else
              echo "ERROR: chroot_native 未正确创建"
              exit 1
            fi
          '

      # ── 构建内核包 ──────────────────────────────────────────
      - name: Build kernel
        run: |
          # 总是 --force：每次 CI 都重新编译
          # 原因：pmaports 缓存命中时 pmbootstrap 认为包已是最新，跳过编译导致无 APK 产出
          docker compose exec -T pmos-builder sh -c \
            'su -s /bin/sh pmbuild -c "export HOME=/work/pmbootstrap; pmbootstrap build --force ${{ env.KERNEL_PKG }}"'

      # ── 收集构建产物 ────────────────────────────────────────
      - name: Collect built APKs
        run: |
          mkdir -p artifacts
          # 用 docker exec 在容器内查找 APK，避免宿主机路径与 pmbootstrap work dir 不一致
          docker compose exec -T pmos-builder sh -c \
            'find /work -name "linux-postmarketos-mediatek-mt81*.apk" 2>/dev/null' \
            | while IFS= read -r apk; do
              docker compose cp "pmos-builder:${apk}" artifacts/ 2>/dev/null || true
            done
          # 备用：直接在宿主机挂载的 work/ 目录下搜索
          find work/ -name "linux-postmarketos-mediatek-mt81*.apk" \
            -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ || echo "未找到 APK 文件"

      - name: Set artifact metadata
        id: artifact-meta
        run: echo "name=kernel-${{ env.KERNEL_PKG }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload kernel APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 保存 ccache（即使构建失败也保存，保留增量编译对象）──
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ccache/
          key: ccache-${{ env.KERNEL_PKG }}-${{ github.ref_name }}-${{ github.run_id }}
