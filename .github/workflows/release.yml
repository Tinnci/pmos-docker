name: Release kernel (google-kukui)

on:
  push:
    tags:
      - 'v*.*.*'          # v1.0.0, v1.2.3-otbr 等
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v1.0.0）'
        required: true
      prerelease:
        description: '标记为预发布版本'
        type: boolean
        default: false
      release_notes:
        description: '额外的发布说明（可选）'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KERNEL_PKG: linux-postmarketos-mediatek-mt81
  DEVICE: google-kukui

jobs:
  # ── 阶段1：复用 build.yml 构建内核（Aggregate Root 边界：Release 不拥有 Build 逻辑）
  build:
    uses: ./.github/workflows/build.yml
    with:
      force_rebuild: true

  # ── 阶段2：消费 build 产物，创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 创建 release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 获取完整历史用于 changelog

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # ── 下载 build 阶段产出的 APK artifact ─────────────────
      - name: Download kernel APKs
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-assets/

      # ── 生成 SHA256 校验文件 ────────────────────────────────
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.apk > SHA256SUMS 2>/dev/null || true
          ls -lh

      # ── 生成 changelog（基于 git log） ───────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "${PREV_TAG}..HEAD" 2>/dev/null | head -30)
          else
            LOG=$(git log --oneline -20 2>/dev/null)
          fi

          cat > /tmp/release-body.md << RELEOF
          ## postmarketOS 内核 ${TAG} — google-kukui (MT8183)

          ### 包含的定制配置

          | 功能 | 说明 |
          |------|------|
          | IPv6/IPv4 多播路由 | OTBR / OpenThread (ESP32-C6 USB RCP) |
          | BLE 支持 | \`BT_LE=y\` — Matter BLE 配网 |
          | 容器网络 | VETH, BRIDGE (Waydroid / Docker) |
          | 网络调度器 | FQ, FQ-CoDel, CAKE |
          | BPF/kprobes | pmaports 合规要求 |
          | Netfilter | iptables + nftables 模块 |

          ### 内核版本
          \`linux-postmarketos-mediatek-mt81\` (MT8183 共享内核，适用于 Chromebook Crane/kukui)

          ### 安装方式
          \`\`\`sh
          sudo apk add --allow-untrusted linux-postmarketos-mediatek-mt81-*.apk
          # 或通过 pmbootstrap 刷入：
          pmbootstrap flasher flash_kernel --device google-kukui
          \`\`\`

          ${{ inputs.release_notes }}

          ### 变更记录
          ${LOG}
          RELEOF

          echo "body_file=/tmp/release-body.md" >> $GITHUB_OUTPUT

      # ── 使用 gh CLI 创建 Release ─────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRERELEASE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          # workflow_dispatch 时 tag 可能不存在，先创建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag "$TAG" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi

          gh release create "$TAG" \
            --title "pmos kernel ${TAG} (google-kukui OTBR+BLE)" \
            --notes-file "${{ steps.changelog.outputs.body_file }}" \
            $PRERELEASE \
            release-assets/*.apk \
            release-assets/SHA256SUMS

          echo "✅ Release ${TAG} 已发布"
          gh release view "$TAG"
